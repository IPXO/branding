name: Brand Misuse Report
description: Report potentially incorrect or unauthorized use of IPXO marks.
title: "[Brand Misuse]: "
labels:
  - brand-policy
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: URL or location where misuse was seen.
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe what appears incorrect.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add screenshots or context if available.
