name: Asset Request
description: Request a new official format, size, or variant.
title: "[Asset Request]: "
labels:
  - asset-request
body:
  - type: input
    id: asset
    attributes:
      label: Requested asset
      description: Which file/variant is needed?
      placeholder: "Example: Symbol PNG at 512x512 transparent"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Where will this asset be used?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Any constraints, deadlines, or examples.
