name: Release Brand Pack

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (for example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [ -z "$tag" ]; then
            echo "Tag is required" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build brand pack zip
        run: |
          chmod +x scripts/build_brand_pack.sh
          ./scripts/build_brand_pack.sh "${{ steps.vars.outputs.tag }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipxo-brand-${{ steps.vars.outputs.tag }}
          path: dist/ipxo-brand-${{ steps.vars.outputs.tag }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: IPXO Brand Pack ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: dist/ipxo-brand-${{ steps.vars.outputs.tag }}.zip
