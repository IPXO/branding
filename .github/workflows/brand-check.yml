name: Brand Check

on:
  pull_request:
  push:
    branches:
      - main
      - review

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run brand checks
        run: |
          chmod +x scripts/brand_check.sh
          ./scripts/brand_check.sh
